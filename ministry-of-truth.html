<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ministry of Truth</title>
<style>
  /* ---------- THEME ----------
     Change the whole mood of the game by editing these lines. */
  :root {
    --ink:    #1a1815;   /* dark background */
    --paper:  #ded6c2;   /* document paper */
    --desk:   #2b2723;   /* desk surface */
    --stamp:  #a32b25;   /* the red FLAGGED stamp */
    --ok:     #6f8f5f;   /* muted green for "correct" */
    --amber:  #c9962e;   /* resistance / defiance */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    color: var(--paper);
    font-family: "Courier New", Courier, monospace;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }

  #game { width: 100%; max-width: 940px; }

  /* ---------- HEADER ---------- */
  header {
    border-bottom: 1px solid #4a443c;
    padding-bottom: 12px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 { font-size: 18px; letter-spacing: 4px; margin: 0; text-transform: uppercase; }
  #status { font-size: 13px; color: #8a8175; }

  /* ---------- METERS ---------- */
  #meters {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    margin-bottom: 18px;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .meter-label { color: #8a8175; text-transform: uppercase; font-size: 11px; letter-spacing: 2px; }
  .bar { font-size: 15px; letter-spacing: 1px; }
  .bar.rations { color: var(--ok); }
  .bar.rations.low { color: var(--stamp); }
  .bar.resist { color: var(--amber); }
  .bar.clock { color: var(--paper); letter-spacing: 2px; }
  .bar.clock.low { color: var(--stamp); animation: tick 1s steps(2) infinite; }
  @keyframes tick { 50% { opacity: 0.4; } }
  .meter .num { color: #8a8175; font-size: 12px; margin-left: 6px; }

  /* ---------- LAYOUT ---------- */
  #cols {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 20px;
    align-items: start;
  }

  /* ---------- RULEBOOK ---------- */
  #rulebook {
    background: var(--desk);
    border: 1px solid #4a443c;
    padding: 16px;
  }
  #rulebook h2 {
    font-size: 11px; letter-spacing: 2px; margin: 0 0 12px;
    color: #8a8175; text-transform: uppercase;
  }
  #rules { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.7; }
  #rules li { margin-bottom: 8px; }
  #rules li.new { color: var(--stamp); font-weight: bold; }
  .rule-hint { margin-top: 14px; font-size: 11px; color: #6b6455; line-height: 1.6; }

  /* ---------- THE CLERK'S INNER VOICE ---------- */
  #thought {
    font-style: italic; color: #a89e88; font-size: 13px; line-height: 1.6;
    margin-bottom: 14px; min-height: 20px;
  }

  /* ---------- THE DOCUMENT ---------- */
  #doc-wrap { position: relative; }
  #doc {
    background: var(--paper);
    color: #2b2723;
    padding: 28px;
    min-height: 240px;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.4);
    user-select: none;
  }
  .doc-meta {
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    color: #6b6455; border-bottom: 1px solid #b9b09a;
    padding-bottom: 10px; margin-bottom: 16px;
  }
  .doc-body { font-size: 15px; line-height: 2.0; }
  /* Each word is its own token so the marker can black it out. */
  .tok { padding: 1px 1px; border-radius: 2px; }
  #doc.marking .tok:hover:not(.blacked) { background: rgba(0,0,0,0.12); }
  #doc.marking { cursor: crosshair; }
  .tok.blacked { background: #141414; color: #141414; box-shadow: 0 0 0 1px #141414; }

  /* The stamp that slams down after each decision. */
  #stamp {
    position: absolute; top: 42%; left: 50%;
    padding: 8px 24px; border: 4px solid;
    font-size: 26px; font-weight: bold; letter-spacing: 6px;
    opacity: 0; pointer-events: none;
    transform: translate(-50%, -50%) rotate(-12deg) scale(2.5);
  }
  #stamp.show { animation: slam 0.4s ease-out forwards; }
  @keyframes slam {
    to { opacity: 0.88; transform: translate(-50%, -50%) rotate(-12deg) scale(1); }
  }

  /* ---------- TOOLS + BUTTONS ---------- */
  #tools { display: flex; gap: 10px; margin-top: 18px; }
  #choices { display: flex; gap: 12px; margin-top: 10px; }
  button {
    font-family: inherit; font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; padding: 14px;
    background: var(--desk); color: var(--paper);
    border: 1px solid #4a443c; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #3a352f; }
  button:disabled { opacity: 0.3; cursor: default; }
  #btn-marker { flex: 0 0 auto; }
  #btn-marker.active { background: var(--amber); color: #1a1815; border-color: var(--amber); font-weight: bold; }
  #btn-clear { flex: 0 0 auto; }
  #btn-file { flex: 1; font-size: 14px; letter-spacing: 3px; padding: 16px; }

  /* ---------- FEEDBACK ---------- */
  #feedback { margin-top: 14px; min-height: 44px; font-size: 13px; line-height: 1.6; }
  #feedback.good { color: var(--ok); }
  #feedback.bad  { color: var(--stamp); }
  #feedback.defy { color: var(--amber); }
  #feedback.guilt { color: #b0a894; }

  /* ---------- FULL-SCREEN SCREENS ---------- */
  #view .screen {
    text-align: center;
    padding: 40px 20px 60px;
    max-width: 560px;
    margin: 0 auto;
  }
  .screen h2 {
    font-size: 26px; letter-spacing: 6px; text-transform: uppercase;
    margin: 0 0 20px; color: var(--paper);
  }
  .screen h2.red { color: var(--stamp); }
  .screen h2.amber { color: var(--amber); }
  .screen p { line-height: 1.9; font-size: 14px; margin: 0 auto 20px; }
  .screen .orders {
    text-align: left; background: var(--desk); border: 1px solid #4a443c;
    padding: 16px 20px; margin: 0 auto 24px; font-size: 13px; line-height: 1.8;
  }
  .screen .orders .new { color: var(--stamp); font-weight: bold; }
  .screen .muted { color: #8a8175; font-size: 13px; }
  .screen button { margin-top: 10px; padding: 16px 28px; font-size: 14px; letter-spacing: 3px; }

  @media (max-width: 720px) {
    #cols { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="game">
  <header>
    <h1>Ministry of Truth</h1>
    <div id="status"></div>
  </header>
  <div id="view"></div>
</div>

<!-- Game logic lives in src/game.ts and compiles to dist/game.js (run `npm run build`). -->
<script src="dist/game.js"></script>

</body>
</html>
